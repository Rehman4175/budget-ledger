                                        <SectionTotal label="Total fixed" value={totalFixed} tone={DEBIT} hidden={hideAmounts} />
                                    </div>
                                    <div>
                                        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>Variable / household</div>
                                        {data.variable.map((r) => (
                                            <RowShell key={r.id} onRemove={() => removeRow("variable", r.id)} dragProps={dragProps("variable", r.id)}>
                                                <TextCell value={r.name} onChange={(v) => updateRow("variable", r.id, { name: v })} />
                                                <NumberCell value={r.amount} onChange={(v) => updateRow("variable", r.id, { amount: v })} tone={DEBIT} />
                                                <select value={r.paid ? "paid" : "unpaid"} onChange={(e) => updateRow("variable", r.id, { paid: e.target.value === "paid" })} style={{ padding: "5px 2px", border: `1px solid ${r.paid ? CREDIT : RULE}`, borderRadius: 3, background: r.paid ? "#E1EEE7" : "#fff", color: r.paid ? CREDIT : TEXT, fontSize: 11 }}><option value="unpaid">Unpaid</option><option value="paid">Paid</option></select>
                                            </RowShell>
                                        ))}
                                        <AddButton onClick={() => addRow("variable", { name: "New item", amount: 0, paid: false })}>Add variable item</AddButton>
                                        <SectionTotal label="Total variable" value={totalVariable} tone={DEBIT} hidden={hideAmounts} />
                                    </div>
                                </div>

                                <div className="surplus-bar" style={{ marginTop: 26, padding: "16px 20px", background: PAPER_DARK, borderRadius: 3, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                    <div>
                                        <div style={{ fontSize: 12, color: "#6B6555" }}>Total outgo {amt(totalOutgo)} &middot; Salary {amt(data.salary)}</div>
                                        <div style={{ fontSize: 13, fontWeight: 700, marginTop: 2 }}>Monthly surplus</div>
                                    </div>
                                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 24, fontWeight: 700, color: surplus >= 0 ? CREDIT : DEBIT }}>
                                        {amt(surplus)}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "balance" && (
                            <div>
                                <div className="two-col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>
                                    <Field label="BANK BALANCE — OPENING THIS MONTH">
                                        {hideAmounts ? (
                                            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 20, fontWeight: 700, color: INK }}>****</span>
                                        ) : (
                                            <NumberCellStandalone value={data.openingBalance} onChange={(v) => update({ openingBalance: v })} />
                                        )}
                                    </Field>
                                    <Field label="MINIMUM BALANCE TO KEEP">
                                        {hideAmounts ? (
                                            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 20, fontWeight: 700, color: INK }}>****</span>
                                        ) : (
                                            <NumberCellStandalone value={data.minBalance} onChange={(v) => update({ minBalance: v })} />
                                        )}
                                    </Field>
                                </div>

                                {data.alreadyDeducted && data.alreadyDeducted.length > 0 && (
                                    <div style={{ marginTop: 20, fontSize: 12, color: "#6B6555", fontStyle: "italic" }}>
                                        Already deducted this month (reference only, already inside the balance above): {" "}
                                        {data.alreadyDeducted.map((a) => a.name).join(", ")} = {amt(totalAlready)}
                                    </div>
                                )}

                                <div style={{ marginTop: 20 }}>
                                    <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>Bills & payments before next salary</div>
                                    <div style={{ fontSize: 11.5, color: "#6B6555", marginBottom: 8 }}>Only <strong>Paid</strong> entries reduce Current Bank Balance. Unpaid bills appear only in the projection.</div>
                                    <div className="expense-grid" style={{ display: "grid", gridTemplateColumns: "70px 1fr 78px 78px 70px 100px 28px", gap: 8, fontSize: 11, color: "#6B6555", paddingBottom: 4, borderBottom: `1px solid ${RULE}` }}>
                                        <span>Date</span><span>Item</span><span style={{ textAlign: "right" }}>Planned</span><span style={{ textAlign: "right" }}>Paid amt.</span><span>Status</span><span style={{ textAlign: "right" }}>Bank balance</span><span />
                                    </div>
                                    {expenseRows.map((e) => (
                                        <div key={e.id} {...dragProps(e.sourceList || "expenses", e.sourceId || e.id)} className="expense-grid" title="Drag to reorder" style={{ display: "grid", gridTemplateColumns: "70px 1fr 78px 78px 70px 100px 28px", gap: 8, alignItems: "center", padding: "5px 0", borderBottom: `1px solid ${RULE}`, cursor: "grab", ...(dragProps(e.sourceList || "expenses", e.sourceId || e.id).style) }}>
                                            <DateInput value={e.date} onChange={(v) => updateBalanceRow(e, { date: v })} />
                                            <TextCell value={e.name} onChange={(v) => updateBalanceRow(e, { name: v })} />
                                            <NumberCell value={e.planned} onChange={(v) => updateBalanceRow(e, { planned: v })} />
                                            <NumberCell value={e.actual} placeholder="—" onChange={(v) => updateBalanceRow(e, { actual: v })} tone={DEBIT} />
                                            <select value={e.paid ? "paid" : "unpaid"} onChange={(ev) => updateBalanceRow(e, { paid: ev.target.value === "paid" })} style={{ padding: "5px 2px", border: `1px solid ${e.paid ? CREDIT : RULE}`, borderRadius: 3, background: e.paid ? "#E1EEE7" : "#fff", color: e.paid ? CREDIT : TEXT, fontSize: 11 }}>
                                                <option value="unpaid">Unpaid</option><option value="paid">Paid</option>
                                            </select>
                                            <span style={{ textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: e.paid ? TEXT : "#8A8470" }}>{amt(e.balanceAfter)}</span>
                                            <button onClick={() => removeBalanceRow(e)} style={{ border: "none", background: "none", cursor: "pointer", color: "#9A9282" }}>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                            </button>
                                        </div>
                                    ))}
                                    <AddButton onClick={() => addRow("expenses", { date: "", name: "New expense", planned: 0, actual: "", paid: false })}>Add bill</AddButton>
                                </div>

                                <div className="cards-row" style={{ marginTop: 22, display: "flex", gap: 16 }}>
                                    <div style={{ flex: 1, padding: "14px 18px", background: PAPER_DARK, borderRadius: 3 }}>
                                        <div style={{ fontSize: 12, color: "#6B6555" }}>Current bank balance</div>
                                        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 22, fontWeight: 700, marginTop: 2, color: actualBalance < 0 ? DEBIT : TEXT }}>{amt(actualBalance)}</div>
                                        <div style={{ fontSize: 11, color: "#8A8470", marginTop: 2 }}>
                                            {totalMisc > 0
                                                ? <>Planned bills + {amt(totalMisc)} misc spends — this is what carries to next month.</>
                                                : "This becomes next month's opening balance automatically."}
                                        </div>
                                    </div>
                                    <div style={{ flex: 1, padding: "14px 18px", background: actualBuffer < 0 ? "#F3DAD5" : PAPER_DARK, borderRadius: 3, display: "flex", flexDirection: "column", gap: 2 }}>
                                        <div style={{ fontSize: 12, color: "#6B6555" }}>Projected after unpaid bills</div>
                                        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 22, fontWeight: 700, color: projectedBalance - totalMisc < 0 ? DEBIT : CREDIT }}>{amt(projectedBalance - totalMisc)}</div>
                                        {actualBuffer < 0 && (
                                            <div style={{ display: "flex", gap: 5, alignItems: "center", fontSize: 11, color: DEBIT, marginTop: 2 }}>
                                                <IconComponent name="AlertTriangle" size={12} /> below minimum — hold off on wishlist / CC spend
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === "wishlist" && (
                            <div>
                                <div style={{ fontSize: 12, color: "#6B6555", marginBottom: 14 }}>
                                    Monthly surplus available: <strong style={{ color: CREDIT }}>{amt(surplus)}</strong> — health items are worth funding first.
                                </div>
                                <div className="wishlist-grid" style={{ display: "grid", gridTemplateColumns: "1fr 90px 90px 90px 90px 28px", gap: 8, fontSize: 11, color: "#6B6555", paddingBottom: 4, borderBottom: `1px solid ${RULE}` }}>
                                    <span>Item</span><span style={{ textAlign: "right" }}>Cost</span><span>Priority</span><span style={{ textAlign: "right" }}>Saved</span><span style={{ textAlign: "right" }}>Needed</span><span />
                                </div>
                                {data.wishlist.map((w) => {
                                    const needed = Math.max((Number(w.cost) || 0) - (Number(w.saved) || 0), 0);
                                    return (
                                        <div key={w.id} {...dragProps("wishlist", w.id)} className="wishlist-grid" title="Drag to reorder" style={{ display: "grid", gridTemplateColumns: "1fr 90px 90px 90px 90px 28px", gap: 8, alignItems: "center", padding: "6px 0", borderBottom: `1px solid ${RULE}`, cursor: "grab", ...(dragProps("wishlist", w.id).style) }}>
                                            <TextCell value={w.name} onChange={(v) => updateRow("wishlist", w.id, { name: v })} />
                                            <NumberCell value={w.cost} placeholder="—" onChange={(v) => updateRow("wishlist", w.id, { cost: v })} />
                                            <select
                                                value={w.priority}
                                                onChange={(e) => updateRow("wishlist", w.id, { priority: e.target.value })}
                                                style={{ background: "transparent", border: "none", borderBottom: `1px solid ${RULE}`, fontSize: 13, padding: "4px 0", color: w.priority === "High" ? DEBIT : TEXT }}
                                            >
                                                <option>High</option>
                                                <option>Medium</option>
                                                <option>Low</option>
                                            </select>
                                            <NumberCell value={w.saved} onChange={(v) => updateRow("wishlist", w.id, { saved: v })} />
                                            <span style={{ textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: DEBIT }}>{amt(needed)}</span>
                                            <button onClick={() => removeRow("wishlist", w.id)} style={{ border: "none", background: "none", cursor: "pointer", color: "#9A9282" }}>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                            </button>
                                        </div>
                                    );
                                })}
                                <AddButton onClick={() => addRow("wishlist", { name: "New item", cost: "", priority: "Medium", saved: 0 })}>Add wishlist item</AddButton>
                                <SectionTotal label="Total still needed" value={wishlistTotalNeeded} tone={DEBIT} hidden={hideAmounts} />
                                {surplus > 0 && wishlistTotalNeeded > 0 && (
                                    <div style={{ marginTop: 8, fontSize: 12, color: "#6B6555" }}>
                                        At the full surplus, that's about {Math.ceil(wishlistTotalNeeded / surplus)} month(s) to save it all.
                                    </div>
                                )}
                            </div>
                        )}

                        {tab === "misc" && (
                            <div>
                                <div style={{ fontSize: 12.5, lineHeight: 1.6, color: "#4A4636", marginBottom: 14 }}>
                                    Bank-statement style — log whatever you spend (chai {inr(10)}, snacks {inr(12)}, auto {inr(15)}…)
                                    and the balance keeps dropping. The starting balance below is what's left after the planned bills
                                    on the Closing Balance tab. Dates auto-fill as <strong>dd-mmm-yy</strong> (e.g. {todayText()}).
                                </div>

                                {miscRows.length === 0 ? (
                                    <div style={{ padding: "18px 20px", background: PAPER_DARK, borderRadius: 3, fontSize: 12.5, color: "#6B6555", marginBottom: 12 }}>
                                        No spends logged yet. Tap <strong>+ Add spend</strong> and enter ₹10, ₹12, ₹15… whatever you spent —
                                        each entry instantly reduces your balance. Dates auto-fill with today's date.
                                    </div>
                                ) : (
                                    <div className="misc-grid" style={{ display: "grid", gridTemplateColumns: "84px 1fr 90px 110px 28px", gap: 8, fontSize: 11, color: "#6B6555", paddingBottom: 4, borderBottom: `1px solid ${RULE}` }}>
                                        <span>Date</span><span>What</span><span style={{ textAlign: "right" }}>Amount</span><span style={{ textAlign: "right" }}>Balance After</span><span />
                                    </div>
                                )}
                                {miscRows.map((m) => (
                                    <div key={m.id} {...dragProps("misc", m.id)} className="misc-grid" title="Drag to reorder" style={{ display: "grid", gridTemplateColumns: "84px 1fr 90px 110px 28px", gap: 8, alignItems: "center", padding: "5px 0", borderBottom: `1px solid ${RULE}`, cursor: "grab", ...(dragProps("misc", m.id).style) }}>
                                        <DateInput value={m.date} onChange={(v) => updateRow("misc", m.id, { date: v })} />
                                        <TextCell value={m.name} onChange={(v) => updateRow("misc", m.id, { name: v })} placeholder="what was it for?" />
                                        <NumberCell value={m.amount} placeholder="0" onChange={(v) => updateRow("misc", m.id, { amount: v })} tone={DEBIT} />
                                        <span style={{ textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: m.balanceAfter < 0 ? DEBIT : TEXT }}>{amt(m.balanceAfter)}</span>
                                        <button onClick={() => removeRow("misc", m.id)} style={{ border: "none", background: "none", cursor: "pointer", color: "#9A9282" }}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                        </button>
                                    </div>
                                ))}
                                <AddButton onClick={() => addRow("misc", { date: todayText(), name: "", amount: "" })}>Add spend</AddButton>
                                {totalMisc > 0 && <SectionTotal label="Total misc spent" value={totalMisc} tone={DEBIT} hidden={hideAmounts} />}

                                <div className="cards-row" style={{ marginTop: 22, display: "flex", gap: 16 }}>
                                    <div style={{ flex: 1, padding: "14px 18px", background: actualBalance < 0 ? "#F3DAD5" : PAPER_DARK, borderRadius: 3 }}>
                                        <div style={{ fontSize: 12, color: "#6B6555" }}>Actual balance now (after misc spends)</div>
                                        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 26, fontWeight: 700, marginTop: 2, color: actualBalance < 0 ? DEBIT : CREDIT }}>{amt(actualBalance)}</div>
                                        <div style={{ fontSize: 11, color: "#8A8470", marginTop: 2 }}>Starts at {amt(currentBalanceBeforeMisc)} after paid bills.</div>
                                    </div>
                                    <div style={{ flex: 1, padding: "14px 18px", background: actualBuffer < 0 ? "#F3DAD5" : PAPER_DARK, borderRadius: 3, display: "flex", flexDirection: "column", gap: 2 }}>
                                        <div style={{ fontSize: 12, color: "#6B6555" }}>Buffer above minimum ({amt(data.minBalance)})</div>
                                        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 22, fontWeight: 700, color: actualBuffer < 0 ? DEBIT : CREDIT }}>{amt(actualBuffer)}</div>
                                        {actualBuffer < 0 && (
                                            <div style={{ display: "flex", gap: 5, alignItems: "center", fontSize: 11, color: DEBIT, marginTop: 2 }}>
                                                <IconComponent name="AlertTriangle" size={12} /> below minimum — hold off on more spend
                                            </div>
                                        )}
                                    </div>                                    </div>
                            </div>
                        )}

                        {tab === "notes" && (
                            <div>
                                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 2 }}>📔 Notes / Journal</div>
                                <div style={{ fontSize: 12, color: "#6B6555", marginBottom: 14, lineHeight: 1.6 }}>
                                    Notepad style — write whatever you want: daily thoughts, tasks, things to remember. Each note gets its date automatically — format <strong>dd-mmm-yy</strong> (e.g. {todayText()}).
                                </div>

                                <div className="notes-grid" style={{ display: "grid", gridTemplateColumns: "84px 1fr 28px", gap: 8, fontSize: 11, color: "#6B6555", paddingBottom: 4, borderBottom: `1px solid ${RULE}` }}>
                                    <span>Date</span><span>Note</span><span />
                                </div>
                                {notes.length === 0 && (
                                    <div style={{ padding: "18px 20px", background: PAPER_DARK, borderRadius: 3, fontSize: 12.5, color: "#6B6555", margin: "12px 0" }}>
                                        No notes yet — tap <strong>+ Add note</strong> below and start writing.
                                    </div>
                                )}
                                {notes.map((n) => (
                                    <div key={n.id} {...dragProps("notes", n.id)} className="notes-grid" title="Drag to reorder" style={{ display: "grid", gridTemplateColumns: "84px 1fr 28px", gap: 8, alignItems: "start", padding: "6px 0", borderBottom: `1px solid ${RULE}`, cursor: "grab", ...(dragProps("notes", n.id).style) }}>
                                        <DateInput value={n.date} onChange={(v) => updateRow("notes", n.id, { date: v })} />
                                        <textarea
                                            value={n.text || ""}
                                            onChange={(e) => updateRow("notes", n.id, { text: e.target.value })}
                                            placeholder="What happened today, what's on your mind… write anything"
                                            style={{ width: "100%", background: "transparent", border: "none", borderBottom: `1px solid ${RULE}`, fontFamily: "'Source Serif 4', Georgia, serif", fontSize: 13.5, lineHeight: 1.5, color: TEXT, resize: "vertical", minHeight: 44, padding: "2px", outline: "none" }}
                                        />
                                        <button onClick={() => removeRow("notes", n.id)} style={{ border: "none", background: "none", cursor: "pointer", color: "#9A9282", paddingTop: 4 }} aria-label="Delete note">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                        </button>
                                    </div>
                                ))}
                                <AddButton onClick={() => addRow("notes", { date: todayText(), text: "" })}>Add note</AddButton>
                            </div>
                        )}

                        {tab === "savings" && (
                            <div>
                                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>Long-term savings (from Fixed commitments)</div>
                                {data.fixed.filter((r) => /sip|lic/i.test(r.name)).map((r) => (
                                    <div key={r.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${RULE}` }}>
                                        <span>{r.name}</span>
                                        <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{amt(r.amount)} / month</span>
                                    </div>
                                ))}
                                <SectionTotal
                                    label="Total long-term savings"
                                    value={sum(data.fixed.filter((r) => /sip|lic/i.test(r.name)), "amount")}
                                    tone={CREDIT}
                                    hidden={hideAmounts}
                                />
                                <div style={{ marginTop: 6, fontSize: 12, color: "#6B6555" }}>
                                    {((sum(data.fixed.filter((r) => /sip|lic/i.test(r.name)), "amount") / (data.salary || 1)) * 100).toFixed(1)}% of salary
                                </div>

                                <div style={{ marginTop: 24, padding: "14px 18px", background: PAPER_DARK, borderRadius: 3, fontSize: 12.5, lineHeight: 1.6 }}>
                                    <strong>For reference (not personalised advice):</strong>
                                    <ul style={{ margin: "8px 0 0", paddingLeft: 18 }}>
                                        <li>~20% of take-home toward savings/investing is a commonly cited starting point — you're already close to that.</li>
                                        <li>A 3–6 month emergency fund in a liquid account is usually recommended before increasing SIP further.</li>
                                        <li>Once the Scooty EMI ends, that {inr(4652)}/month frees up automatically.</li>
                                        <li>For fund selection or LIC specifics, a SEBI-registered adviser or your LIC agent can tailor this to you.</li>
                                    </ul>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BudgetLedger />);
    </script>
</body>
</html>
