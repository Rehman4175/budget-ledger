<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Ledger</title>
    
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: #F1EDE1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        #root {
            width: 100%;
            max-width: 900px;
        }
        
        /* Input styles */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        
        /* Spin animation */
        .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ---------- Mobile / phone view ---------- */
        @media (max-width: 640px) {
            html, body { overflow-x: hidden; }
            body { padding: 8px; align-items: flex-start; }
            #root { max-width: 100%; }
            .cover { flex-wrap: wrap; gap: 10px; padding: 14px 16px !important; }
            .cover-controls { flex-wrap: wrap; gap: 8px !important; }
            .tabbar { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .tabbar button { flex: 0 0 auto !important; padding: 10px 12px !important; white-space: nowrap; }
            .content { padding: 14px 14px 24px !important; }
            .two-col { grid-template-columns: 1fr !important; gap: 14px !important; }
            .cards-row { flex-direction: column !important; }
            .surplus-bar { flex-direction: column !important; align-items: flex-start !important; gap: 8px !important; }
            .connect-row { flex-wrap: wrap; }
            .connect-row button { flex: 1; }
            .expense-grid { grid-template-columns: 48px 1fr 42px 42px 64px 22px !important; gap: 4px !important; }
            .misc-grid { grid-template-columns: 62px 1fr 56px 70px 22px !important; gap: 4px !important; }
            .notes-grid { grid-template-columns: 70px 1fr 22px !important; gap: 6px !important; }
            .wishlist-grid { grid-template-columns: 1fr 46px 56px 46px 58px 22px !important; gap: 4px !important; }
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // ---------- Constants ----------
        const URL_KEY = "ledger-apps-script-url-v1";
        const uid = () => Math.random().toString(36).slice(2, 10);
        const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        const inr = (n) => {
            const v = Number(n) || 0;
            return "\u20B9" + v.toLocaleString("en-IN", { maximumFractionDigits: 0 });
        };

        const currentMonthKey = () => {
            const d = new Date();
            return `${MONTHS[d.getMonth()]}-${d.getFullYear()}`;
        };

        // ---------- Date helpers (auto dd-MMM-yy, e.g. 05-Sep-26) ----------
        const PAD = (n) => String(n).padStart(2, "0");
        const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const monthIdx = (name) => {
            const s = String(name || "").toLowerCase();
            if (s.length < 3) return -1;
            const p = s.slice(0, 3);
            for (let i = 0; i < MONTH_NAMES.length; i++) {
                if (MONTH_NAMES[i].toLowerCase().slice(0, 3) === p) return i;
            }
            return -1;
        };
        const fmtDateText = (d) => PAD(d.getDate()) + "-" + MONTHS[d.getMonth()] + "-" + String(d.getFullYear()).slice(-2);
        const todayText = () => fmtDateText(new Date());
        const parseDateAny = (raw) => {
            const s = String(raw == null ? "" : raw).trim();
            if (!s) return null;
            // day-month-year — separators optional, so 6sep26 / 06-Sep-26 / 5 september 2026 all work
            let m = s.match(/^(\d{1,2})[-/.\s]*([A-Za-z]{3,9})[-/.\s]*(\d{2,4})$/);
            if (m) {
                const mon = monthIdx(m[2]);
                if (mon < 0) return null;
                const y = +m[3] < 100 ? +m[3] + 2000 : +m[3];
                const d = new Date(y, mon, +m[1]);
                return d.getFullYear() === y && d.getMonth() === mon && d.getDate() === +m[1] ? d : null;
            }
            m = s.match(/^(\d{1,4})[-/.\s]+(\d{1,2})[-/.\s]+(\d{1,4})$/);
            if (m) {
                const a = +m[1], b = +m[2], c = +m[3];
                let y, mo, da;
                if (a >= 1000) { y = a; mo = b; da = c; }
                else { y = c < 100 ? c + 2000 : c; mo = b; da = a; }
                const d = new Date(y, mo - 1, da);
                return d.getFullYear() === y && d.getMonth() === mo - 1 && d.getDate() === da ? d : null;
            }
            return null;
        };
        const normDate = (raw) => {
            const s = String(raw == null ? "" : raw).trim();
            if (!s) return "";
            const d = parseDateAny(s);
            return d ? fmtDateText(d) : s;
        };

        const TABS = [
            { id: "overview", label: "Overview", icon: "BookOpen" },
            { id: "balance", label: "Closing Balance", icon: "Wallet" },
            { id: "misc", label: "Misc", icon: "Receipt" },
            { id: "notes", label: "Notes", icon: "Notebook" },
            { id: "wishlist", label: "Wishlist", icon: "ListChecks" },
            { id: "savings", label: "Savings", icon: "PiggyBank" },
        ];

        const INK = "#1B2A4A";
        const PAPER = "#F1EDE1";
        const PAPER_DARK = "#E7E1D0";
        const RULE = "#C7BFA8";
        const DEBIT = "#A6392C";
        const CREDIT = "#2E6650";
        const TEXT = "#26241D";

        const SECURITY_QUESTIONS = [
            "What is your favorite actor's last name?",
            "What is your pet's name?",
            "What is your best friend's name?",
            "What is your mother's maiden name?",
            "What city were you born in?",
            "What is the name of your first school?",
            "What is your childhood nickname?",
        ];

        // ---------- Backend Calls ----------
        // Apps Script /exec URLs can throw transient errors (a 404 right after a
        // redeploy, a hiccup on Google's side, a flaky network). Retry a few times
        // with backoff so saves/loads stay smooth instead of failing on the first try.
        // A hard timeout per attempt stops the "Opening the ledger…" screen from
        // hanging forever when the request never gets an answer.
        async function retryFetch(url, options, attempts = 3, timeoutMs = 10000) {
            let lastErr = null;
            for (let attempt = 1; attempt <= attempts; attempt++) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const res = await fetch(url, Object.assign({}, options, { signal: controller.signal }));
                    clearTimeout(timer);
                    if (!res.ok) throw new Error("HTTP " + res.status + (res.statusText ? " " + res.statusText : ""));
                    return await res.json();
                } catch (error) {
                    clearTimeout(timer);
                    lastErr = error && error.name === "AbortError"
                        ? new Error("Timed out after " + (timeoutMs / 1000) + "s — the Sheet didn't answer (quota exhausted or script stuck). Wait a bit and retry.")
                        : error;
                    console.error("Request attempt " + attempt + " failed:", lastErr);
                    if (attempt < attempts) await new Promise((r) => setTimeout(r, attempt * 800));
                }
            }
            throw lastErr;
        }

        async function fetchMonth(baseUrl, monthKey) {
            const fullUrl = `${baseUrl}${baseUrl.includes("?") ? "&" : "?"}month=${encodeURIComponent(monthKey)}`;
            try {
                return await retryFetch(fullUrl, {
                    method: "GET",
                    cache: "no-store",
                    headers: { "Accept": "application/json" },
                });
            } catch (error) {
                console.error("Fetch error:", error);
                throw error;
            }
        }

        async function saveMonth(baseUrl, monthKey, data) {
            try {
                return await retryFetch(baseUrl, {
                    method: "POST",
                    cache: "no-store",
                    headers: {
                        // text/plain keeps this a simple CORS request (no preflight/OPTIONS).
                        // Apps Script reads the raw body via e.postData.contents either way.
                        "Content-Type": "text/plain;charset=utf-8",
                        "Accept": "application/json",
                    },
                    body: JSON.stringify({ month: monthKey, data }),
                });
            } catch (error) {
                console.error("Save error:", error);
                throw error;
            }
        }

        // ---------- Small Components ----------
        function Field({ label, children }) {
            return (
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <span style={{ fontSize: 11, letterSpacing: 0.3, color: "#6B6555" }}>{label}</span>
                    {children}
                </div>
            );
        }

        function NumberCell({ value, onChange, placeholder, tone }) {
            return (
                <input
                    type="number"
                    value={value === "" || value === undefined ? "" : value}
                    placeholder={placeholder}
                    onChange={(e) => onChange(e.target.value === "" ? "" : Number(e.target.value))}
                    style={{
                        width: "100%", background: "transparent", border: "none",
                        borderBottom: `1px solid ${RULE}`, textAlign: "right",
                        fontFamily: "'IBM Plex Mono', monospace", fontSize: 14,
                        color: tone || TEXT, padding: "4px 2px", outline: "none",
                    }}
                />
            );
        }

        function TextCell({ value, onChange, placeholder, align }) {
            return (
                <input
                    type="text"
                    value={value}
                    placeholder={placeholder}
                    onChange={(e) => onChange(e.target.value)}
                    style={{
                        width: "100%", background: "transparent", border: "none",
                        borderBottom: `1px solid ${RULE}`, textAlign: align || "left",
                        fontSize: 14, color: TEXT, padding: "4px 2px", outline: "none",
                    }}
                />
            );
        }

        function DateInput({ value, onChange }) {
            return (
                <input
                    type="text"
                    value={value || ""}
                    placeholder="dd-mmm-yy"
                    onChange={(e) => onChange(normDate(e.target.value))}
                    onBlur={(e) => {
                        const v = normDate(e.target.value);
                        if (v !== e.target.value) onChange(v);
                    }}
                    style={{
                        width: "100%", background: "transparent", border: "none",
                        borderBottom: `1px solid ${RULE}`, textAlign: "left",
                        fontFamily: "'IBM Plex Mono', monospace", fontSize: 12,
                        color: TEXT, padding: "4px 2px", outline: "none",
                    }}
                />
            );
        }

        function RowShell({ children, onRemove, dragProps }) {
            return (
                <div {...dragProps} style={{ display: "grid", gridTemplateColumns: "1fr 105px 70px 28px", gap: 10, alignItems: "center", padding: "6px 0", cursor: "grab", ...(dragProps && dragProps.style) }} title="Drag to reorder">
                    {children}
                    <button onClick={onRemove} style={{ border: "none", background: "none", cursor: "pointer", color: "#9A9282", padding: 4 }} aria-label="Remove row">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    </button>
                </div>
            );
        }

        function SectionTotal({ label, value, tone, hidden }) {
            return (
                <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0 4px", borderTop: `2px solid ${INK}`, marginTop: 4 }}>
                    <span style={{ fontWeight: 600, fontSize: 13 }}>{label}</span>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 15, color: tone || TEXT }}>{hidden ? "****" : inr(value)}</span>
                </div>
            );
        }

        function AddButton({ onClick, children }) {
            return (
                <button
                    onClick={onClick}
                    style={{
                        display: "flex", alignItems: "center", gap: 6, marginTop: 10,
                        background: "none", border: `1px dashed ${RULE}`, borderRadius: 3,
                        padding: "6px 10px", fontSize: 12.5, color: INK, cursor: "pointer",
                    }}
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                    {children}
                </button>
            );
        }

        function NumberCellStandalone({ value, onChange }) {
            return (
                <div style={{ display: "flex", alignItems: "baseline", gap: 4, marginTop: 4 }}>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 20 }}>{"\u20B9"}</span>
                    <input
                        type="number"
                        value={value}
                        onChange={(e) => onChange(Number(e.target.value) || 0)}
                        style={{
                            fontSize: 20, fontWeight: 700, border: "none", background: "transparent",
                            borderBottom: `1px solid ${RULE}`, fontFamily: "'IBM Plex Mono', monospace",
                            color: INK, outline: "none", width: 140,
                        }}
                    />
                </div>
            );
        }

        // ---------- Icon Helper ----------
        function IconComponent({ name, size = 14, className = "" }) {
            const icons = {
                BookOpen: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
                Wallet: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>,
                ListChecks: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>,
                PiggyBank: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.5 0 3 1.1 4.1C5.3 17 5 19.5 5 20c0 .5.5 1 1 1h4c.5 0 1-.5 1-1v-1.5h2V20c0 .5.5 1 1 1h4c.5 0 1-.5 1-1 0-.5-.3-3-.1-4.1C21.3 15 22 13.5 22 12c0-1.8-1.4-3-2.5-3.5C19.8 7.5 20 6 20 5c0-.5-.5-1-1-1z"/><circle cx="8" cy="11" r="1"/><circle cx="16" cy="11" r="1"/></svg>,
                Receipt: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/></svg>,
                Notebook: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M16 2v20"/></svg>,
                Settings: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                RefreshCw: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>,
                Check: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
                CloudOff: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/><path d="m22 2-8 8"/><path d="m16 10 6-6"/></svg>,
                ChevronDown: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>,
                AlertTriangle: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
                IndianRupee: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h9"/><path d="M18 13h3"/></svg>,
                Eye: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
                EyeOff: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg>,
            };
            return icons[name] || null;
        }

        // ---------- PIN Lock Screens ----------
        function LockedScreen({ error, onUnlock, onForgot }) {
            const [value, setValue] = useState("");
            const submit = (e) => {
                e.preventDefault();
                onUnlock(value);
                setValue("");
            };
            return (
                <div style={{ fontFamily: "'Source Serif 4', Georgia, serif", background: PAPER, border: `1px solid ${RULE}`, borderRadius: 2, padding: 32, color: TEXT, maxWidth: 400, width: "100%" }}>
                    <div style={{ fontSize: 11, letterSpacing: 1.5, color: "#6B6555" }}>Rehman &middot; Personal Ledger</div>
                    <div style={{ fontSize: 20, fontWeight: 700, marginTop: 6 }}>🔒 Ledger locked</div>
                    <p style={{ fontSize: 12.5, color: "#4A4636", marginTop: 8, lineHeight: 1.5 }}>
                        This link is protected by a PIN — enter it to open. The app locks itself automatically after some idle time.
                    </p>
                    <form onSubmit={submit} style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 10 }}>
                        <input
                            type="password"
                            inputMode="numeric"
                            autoFocus
                            value={value}
                            onChange={(e) => setValue(e.target.value)}
                            placeholder="Enter PIN"
                            style={{ padding: "10px 12px", fontSize: 18, fontFamily: "'IBM Plex Mono', monospace", border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff", color: TEXT, outline: "none", textAlign: "center", letterSpacing: 6 }}
                        />
                        {error && <div style={{ fontSize: 12, color: DEBIT }}>{error}</div>}
                        <button type="submit" style={{ padding: "10px 18px", background: INK, color: PAPER, border: "none", borderRadius: 3, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Unlock</button>
                    </form>
                    <div style={{ marginTop: 12, textAlign: "center" }}>
                        <button onClick={onForgot} style={{ background: "none", border: "none", color: "#8A8470", textDecoration: "underline", cursor: "pointer", fontSize: 11.5 }}>Forgot PIN?</button>
                    </div>
                </div>
            );
        }

        function SetPinScreen({ error, onSave, initialSeconds }) {
            const [p, setP] = useState("");
            const [c, setC] = useState("");
            const [secs, setSecs] = useState(initialSeconds || 60);
            const [qs, setQs] = useState(() => SECURITY_QUESTIONS.slice(0, 3).map((q) => ({ q, a: "" })));
            const submit = (e) => {
                e.preventDefault();
                onSave(p, c, secs, qs);
            };
            const setQ = (i, patch) => setQs((arr) => arr.map((x, j) => (j === i ? { ...x, ...patch } : x)));
            const optionsFor = (i) => SECURITY_QUESTIONS.filter((q) => q === qs[i].q || !qs.some((x, j) => j !== i && x.q === q));
            return (
                <div style={{ fontFamily: "'Source Serif 4', Georgia, serif", background: PAPER, border: `1px solid ${RULE}`, borderRadius: 2, padding: 32, color: TEXT, maxWidth: 400, width: "100%" }}>
                    <div style={{ fontSize: 11, letterSpacing: 1.5, color: "#6B6555" }}>Rehman &middot; Personal Ledger</div>
                    <div style={{ fontSize: 20, fontWeight: 700, marginTop: 6 }}>🔐 Set your PIN</div>
                    <p style={{ fontSize: 12.5, color: "#4A4636", marginTop: 8, lineHeight: 1.5 }}>
                        As soon as this link opens, it will ask for the PIN first. After the timer, the app locks itself automatically (30 sec to 5 min).
                    </p>
                    <form onSubmit={submit} style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 10 }}>
                        <input
                            type="password"
                            inputMode="numeric"
                            autoFocus
                            value={p}
                            onChange={(e) => setP(e.target.value)}
                            placeholder="New PIN (4+ digits, numbers only)"
                            style={{ padding: "10px 12px", fontSize: 16, fontFamily: "'IBM Plex Mono', monospace", border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff", color: TEXT, outline: "none", textAlign: "center", letterSpacing: 4 }}
                        />
                        <input
                            type="password"
                            inputMode="numeric"
                            value={c}
                            onChange={(e) => setC(e.target.value)}
                            placeholder="Confirm PIN"
                            style={{ padding: "10px 12px", fontSize: 16, fontFamily: "'IBM Plex Mono', monospace", border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff", color: TEXT, outline: "none", textAlign: "center", letterSpacing: 4 }}
                        />
                        <label style={{ fontSize: 12, color: "#6B6555", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                            Auto-lock timer:
                            <select
                                value={secs}
                                onChange={(e) => setSecs(Number(e.target.value))}
                                style={{ padding: "6px 8px", border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff", fontSize: 12 }}
                            >
                                <option value={30}>30 sec</option>
                                <option value={60}>1 min</option>
                                <option value={120}>2 min</option>
                                <option value={180}>3 min</option>
                                <option value={300}>5 min</option>
                            </select>
                        </label>
                        <div style={{ marginTop: 4, paddingTop: 10, borderTop: `1px solid ${RULE}` }}>
                            <div style={{ fontSize: 12.5, fontWeight: 700 }}>Security questions (for "Forgot PIN")</div>
                            <div style={{ fontSize: 11.5, color: "#6B6555", marginTop: 2, marginBottom: 8 }}>
                                Pick 3 questions and answer them — these are asked if you ever forget the PIN.
                            </div>
                            {qs.map((item, i) => (
                                <div key={i} style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 8 }}>
                                    <select
                                        value={item.q}
                                        onChange={(e) => setQ(i, { q: e.target.value })}
                                        style={{ padding: "6px 8px", border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff", fontSize: 12 }}
                                    >
                                        {optionsFor(i).map((q) => (
                                            <option key={q} value={q}>{q}</option>
                                        ))}
                                    </select>
                                    <input
                                        type="text"
                                        value={item.a}
                                        onChange={(e) => setQ(i, { a: e.target.value })}
                                        placeholder={"Answer " + (i + 1)}
                                        style={{ padding: "7px 10px", fontSize: 13, border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff", color: TEXT, outline: "none" }}
                                    />
                                </div>
                            ))}
                        </div>

                        {error && <div style={{ fontSize: 12, color: DEBIT }}>{error}</div>}
                        <button type="submit" style={{ padding: "10px 18px", background: INK, color: PAPER, border: "none", borderRadius: 3, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Save PIN</button>
                    </form>
                </div>
            );
        }

        function ForgotPinScreen({ questions, error, onReset, onBack }) {
            const [step, setStep] = useState("verify");
            const [answers, setAnswers] = useState(["", "", ""]);
            const [np, setNp] = useState("");
            const [nc, setNc] = useState("");
            const [localError, setLocalError] = useState("");

            const hasQuestions = questions && questions.length === 3 && questions.every((q) => q && q.q && q.a);
            const shownError = localError || error || "";
            const inputStyle = {
                padding: "10px 12px", fontSize: 16, fontFamily: "'IBM Plex Mono', monospace",
                border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff", color: TEXT, outline: "none",
            };
            const cardStyle = { fontFamily: "'Source Serif 4', Georgia, serif", background: PAPER, border: `1px solid ${RULE}`, borderRadius: 2, padding: 32, color: TEXT, maxWidth: 420, width: "100%" };

            if (!hasQuestions) {
                return (
                    <div style={cardStyle}>
                        <div style={{ fontSize: 20, fontWeight: 700, marginTop: 6 }}>🔒 PIN reset unavailable</div>
                        <p style={{ fontSize: 12.5, color: "#4A4636", marginTop: 8, lineHeight: 1.5 }}>
                            Security questions were never set up on this device, so the PIN can't be recovered here.
                            Clear this site's browser data (localStorage) to start fresh.
                        </p>
                        <button onClick={onBack} style={{ marginTop: 14, padding: "8px 16px", background: "none", color: INK, border: `1px solid ${RULE}`, borderRadius: 3, fontSize: 12.5, cursor: "pointer" }}>Back</button>
                    </div>
                );
            }

            const verify = () => {
                const norm = (x) => String(x || "").trim().toLowerCase();
                for (let i = 0; i < 3; i++) {
                    if (norm(answers[i]) !== norm(questions[i].a)) {
                        setLocalError("Answer " + (i + 1) + " is incorrect — try again.");
                        return;
                    }
                }
                setLocalError("");
                setStep("newpin");
            };

            const submitNew = () => {
                const clean = String(np || "").trim();
                if (clean.length < 4 || !/^\d+$/.test(clean)) {
                    setLocalError("New PIN must be at least 4 digits — numbers only.");
                    return;
                }
                if (clean !== String(nc || "").trim()) {
                    setLocalError("New PINs don't match — try again.");
                    return;
                }
                onReset(clean);
            };

            if (step === "newpin") {
                return (
                    <div style={cardStyle}>
                        <div style={{ fontSize: 20, fontWeight: 700, marginTop: 6 }}>🔐 Set a new PIN</div>
                        <p style={{ fontSize: 12.5, color: "#4A4636", marginTop: 8, lineHeight: 1.5 }}>
                            Security answers verified. Choose your new PIN.
                        </p>
                        <form onSubmit={(e) => { e.preventDefault(); submitNew(); }} style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 10 }}>
                            <input type="password" inputMode="numeric" autoFocus value={np} onChange={(e) => setNp(e.target.value)} placeholder="New PIN (4+ digits, numbers only)" style={{ ...inputStyle, textAlign: "center", letterSpacing: 4 }} />
                            <input type="password" inputMode="numeric" value={nc} onChange={(e) => setNc(e.target.value)} placeholder="Confirm new PIN" style={{ ...inputStyle, textAlign: "center", letterSpacing: 4 }} />
                            {shownError && <div style={{ fontSize: 12, color: DEBIT }}>{shownError}</div>}
                            <button type="submit" style={{ padding: "10px 18px", background: INK, color: PAPER, border: "none", borderRadius: 3, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Save new PIN</button>
                            <button type="button" onClick={() => { setStep("verify"); setLocalError(""); }} style={{ background: "none", border: "none", color: "#8A8470", textDecoration: "underline", cursor: "pointer", fontSize: 11.5 }}>Back</button>
                        </form>
                    </div>
                );
            }

            return (
                <div style={cardStyle}>
                    <div style={{ fontSize: 20, fontWeight: 700, marginTop: 6 }}>🔒 Forgot PIN</div>
                    <p style={{ fontSize: 12.5, color: "#4A4636", marginTop: 8, lineHeight: 1.5 }}>
                        Answer the security questions to reset your PIN.
                    </p>
                    <form onSubmit={(e) => { e.preventDefault(); verify(); }} style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 10 }}>
                        {questions.map((q, i) => (
                            <div key={i} style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                                <div style={{ fontSize: 12, color: "#6B6555" }}>{q.q}</div>
                                <input
                                    type="text"
                                    autoFocus={i === 0}
                                    value={answers[i]}
                                    onChange={(e) => setAnswers((a) => a.map((x, j) => (j === i ? e.target.value : x)))}
                                    placeholder={"Answer " + (i + 1)}
                                    style={{ padding: "8px 10px", fontSize: 14, border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff", color: TEXT, outline: "none" }}
                                />
                            </div>
                        ))}
                        {shownError && <div style={{ fontSize: 12, color: DEBIT }}>{shownError}</div>}
                        <button type="submit" style={{ padding: "10px 18px", background: INK, color: PAPER, border: "none", borderRadius: 3, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Verify</button>
                        <button type="button" onClick={onBack} style={{ background: "none", border: "none", color: "#8A8470", textDecoration: "underline", cursor: "pointer", fontSize: 11.5 }}>Back to login</button>
                    </form>
                </div>
            );
        }

        // ---------- Main App ----------
        function BudgetLedger() {
            const [url, setUrl] = useState(null);
            const [urlDraft, setUrlDraft] = useState("");
            const [checkingUrl, setCheckingUrl] = useState(false);
            const [urlError, setUrlError] = useState("");
            const [showSettings, setShowSettings] = useState(false);

            const [monthKey, setMonthKey] = useState(currentMonthKey());
            const [months, setMonths] = useState([]);
            const [data, setData] = useState(null);
            const [tab, setTab] = useState("overview");
            const [status, setStatus] = useState("idle");
            const [showMonthPicker, setShowMonthPicker] = useState(false);
            const [hideAmounts, setHideAmounts] = useState(() => {
                const saved = localStorage.getItem("ledger-hide-amounts-v1");
                return saved === null ? true : saved === "1"; // hidden by default
            });

            const saveTimer = useRef(null);
            const skipNextSave = useRef(false);
            const pendingSave = useRef(null);
            const draggedRow = useRef(null);
            const [dragging, setDragging] = useState(null);

            // A network request can fail after the user has already edited the page.
            // This separate draft marks data that has not reached the Sheet yet and
            // survives refreshes, closing the tab and browser restarts.
            const cacheKeyFor = (mk) => "ledger-cache-v1-" + mk;
            const draftKeyFor = (mk) => "ledger-offline-draft-v1-" + mk;
            const readSavedCopy = (key) => {
                try { return JSON.parse(localStorage.getItem(key) || "null"); }
                catch (e) { return null; }
            };
            const saveLocalDraft = (mk, value) => {
                const saved = { data: value, at: Date.now() };
                try {
                    // Updating both keys makes an offline reload show the newest edit.
                    localStorage.setItem(cacheKeyFor(mk), JSON.stringify(saved));
                    localStorage.setItem(draftKeyFor(mk), JSON.stringify(saved));
                } catch (e) {
                    console.error("Could not save offline draft:", e);
                }
            };
            const clearDraftIfUnchanged = (mk, value) => {
                const draft = readSavedCopy(draftKeyFor(mk));
                // Do not erase a newer edit if an older request finishes late.
                if (draft && JSON.stringify(draft.data) === JSON.stringify(value)) {
                    try { localStorage.removeItem(draftKeyFor(mk)); } catch (e) {}
                }
            };

            // Remember the show/hide amounts preference
            useEffect(() => {
                localStorage.setItem("ledger-hide-amounts-v1", hideAmounts ? "1" : "0");
            }, [hideAmounts]);

            // ---------- PIN lock ----------
            const [pin, setPin] = useState(() => localStorage.getItem("ledger-pin-v1") || "");
            const [isLocked, setIsLocked] = useState(() => Boolean(localStorage.getItem("ledger-pin-v1")));
            const [pinError, setPinError] = useState("");
            const [showForgot, setShowForgot] = useState(false);
            const [secQuestions, setSecQuestions] = useState(() => {
                try {
                    const v = JSON.parse(localStorage.getItem("ledger-security-v1") || "null");
                    return v && v.length ? v : null;
                } catch (e) { return null; }
            });
            const [lockSeconds, setLockSeconds] = useState(() => {
                const s = Number(localStorage.getItem("ledger-lock-seconds-v1"));
                return s >= 30 && s <= 300 ? s : 60;
            });
            const lastActivity = useRef(Date.now());

            const savePin = (p, c, secs, sec) => {
                const clean = String(p || "").trim();
                if (clean.length < 4 || !/^\d+$/.test(clean)) {
                    setPinError("PIN must be at least 4 digits — numbers only.");
                    return;
                }
                if (clean !== String(c || "").trim()) {
                    setPinError("PINs don't match — try again.");
                    return;
                }
                const secClean = (sec || []).map((s) => ({ q: String(s.q || "").trim(), a: String(s.a || "").trim() }));
                for (let i = 0; i < secClean.length; i++) {
                    if (!secClean[i].q || !secClean[i].a) {
                        setPinError("Answer all " + secClean.length + " security questions.");
                        return;
                    }
                }
                localStorage.setItem("ledger-pin-v1", clean);
                localStorage.setItem("ledger-lock-seconds-v1", String(secs));
                localStorage.setItem("ledger-security-v1", JSON.stringify(secClean));
                setLockSeconds(secs);
                setSecQuestions(secClean);
                setPin(clean);
                setPinError("");
                setIsLocked(false);
                lastActivity.current = Date.now();
            };

            const tryUnlock = (value) => {
                if (String(value || "").trim() === pin) {
                    setIsLocked(false);
                    setPinError("");
                    lastActivity.current = Date.now();
                } else {
                    setPinError("Wrong PIN — try again.");
                }
            };

            const resetPin = () => {
                localStorage.removeItem("ledger-pin-v1");
                setPin("");
                setPinError("");
                setIsLocked(false);
            };

            const resetPinWithSecurity = (newPin) => {
                const clean = String(newPin || "").trim();
                if (clean.length < 4 || !/^\d+$/.test(clean)) return;
                localStorage.setItem("ledger-pin-v1", clean);
                setPin(clean);
                setPinError("");
                setIsLocked(false);
                lastActivity.current = Date.now();
            };

            // Auto-lock after the chosen idle time (30s – 5min)
            useEffect(() => {
                if (!pin || isLocked) return;
                const bump = () => { lastActivity.current = Date.now(); };
                const events = ["mousemove", "mousedown", "keydown", "touchstart", "scroll"];
                events.forEach((ev) => window.addEventListener(ev, bump));
                const onVis = () => {
                    if (document.visibilityState === "visible") {
                        if (Date.now() - lastActivity.current >= lockSeconds * 1000) setIsLocked(true);
                        else lastActivity.current = Date.now();
                    }
                };
                document.addEventListener("visibilitychange", onVis);
                const iv = setInterval(() => {
                    if (Date.now() - lastActivity.current >= lockSeconds * 1000) setIsLocked(true);
                }, 1000);
                return () => {
                    events.forEach((ev) => window.removeEventListener(ev, bump));
                    document.removeEventListener("visibilitychange", onVis);
                    clearInterval(iv);
                };
            }, [pin, isLocked, lockSeconds]);

            // Load saved URL
            useEffect(() => {
                const savedUrl = localStorage.getItem(URL_KEY);
                if (savedUrl) {
                    setUrl(savedUrl);
                    setUrlDraft(savedUrl);
                }
            }, []);

            // Load month data
            const loadMonth = useCallback(async (baseUrl, mk) => {
                // 1) Show a saved copy instantly — no network wait on the phone
                const cacheKey = cacheKeyFor(mk);
                const cached = readSavedCopy(cacheKey);
                const draft = readSavedCopy(draftKeyFor(mk));
                // A local draft has not reached the Sheet, so it must win over
                // both the cache and a successful fetch from the Sheet.
                const localCopy = draft && draft.data ? draft : cached;
                if (localCopy && localCopy.data) {
                    skipNextSave.current = true;
                    setData(localCopy.data);
                    setStatus(draft ? "error" : "synced");
                }
                // Each month has its own persistent draft. Do not let a pending
                // request from the previously selected month be sent to this one.
                pendingSave.current = draft && draft.data ? draft.data : null;
                setUrlError("");
                if (!localCopy || !localCopy.data) setStatus("loading");
                // 2) Then fetch fresh data in the background and update
                try {
                    const json = await fetchMonth(baseUrl, mk);
                    setMonths(json.months || []);
                    if (draft && draft.data) {
                        setStatus("error");
                        setUrlError("Offline changes are safely saved in this browser and will sync automatically.");
                    } else {
                        skipNextSave.current = true;
                        setData(json.data);
                        try { localStorage.setItem(cacheKey, JSON.stringify({ data: json.data, at: Date.now() })); } catch (e) {}
                        setStatus(draft ? "error" : "synced");
                        setUrlError("");
                    }
                } catch (err) {
                    console.error("Load error:", err);
                    if (localCopy && localCopy.data) {
                        // Keep the saved copy on screen; changes will sync when online
                        setStatus("synced");
                        setUrlError("Offline — showing the last saved copy. Changes will sync when the network is back.");
                    } else {
                        setStatus("offline");
                        const lmsg = err && err.message ? String(err.message) : "check connection";
                        setUrlError("Couldn't reach the Sheet: " + lmsg + (lmsg.indexOf("404") >= 0 ? " — the Sheet URL looks stale; open Settings and paste the current /exec URL." : ""));
                    }
                }
            }, []);

            useEffect(() => {
                if (url) {
                    loadMonth(url, monthKey);
                }
            }, [url, monthKey, loadMonth]);

            // Debounced save. NOTE: `months` must NOT be a dependency here — after a
            // successful save setMonths() returns a fresh array, which used to re-trigger
            // this effect → endless save loop → the sheet was rebuilt every second until
            // Apps Script quota ran out and every save started failing.
            useEffect(() => {
                if (!url || !data) return;
                if (skipNextSave.current) {
                    skipNextSave.current = false;
                    return;
                }

                // Save locally before waiting for the debounced network request.
                // This is deliberately synchronous so a page reload while offline
                // cannot lose the user's latest edit.
                saveLocalDraft(monthKey, data);
                pendingSave.current = data;
                setStatus("syncing");
                if (saveTimer.current) clearTimeout(saveTimer.current);

                saveTimer.current = setTimeout(async () => {
                    try {
                        const json = await saveMonth(url, monthKey, data);
                        if (JSON.stringify(pendingSave.current) === JSON.stringify(data)) pendingSave.current = null;
                        clearDraftIfUnchanged(monthKey, data);
                        setMonths((prev) => (json.months && json.months.length ? json.months : prev));
                        try { localStorage.setItem("ledger-cache-v1-" + monthKey, JSON.stringify({ data, at: Date.now() })); } catch (e) {}
                        setStatus("synced");
                        setUrlError("");
                    } catch (err) {
                        console.error("Save error:", err);
                        pendingSave.current = data; // queue it — auto-sync when the network is back
                        setStatus("error");
                        const smsg = err && err.message ? String(err.message) : "unknown error";
                        setUrlError("Save failed: " + smsg + " — will retry automatically when online." + (smsg.indexOf("404") >= 0 ? " If this keeps happening, open Settings and paste the current /exec URL." : ""));
                    }
                }, 700);

                return () => clearTimeout(saveTimer.current);
            }, [data, url, monthKey]);

            // Auto-sync: a failed save is queued (pendingSave) and retried in the
            // background — every 5 seconds and immediately when the network returns.
            useEffect(() => {
                if (!url) return;
                const tryPending = async () => {
                    const pending = pendingSave.current;
                    if (!pending) return;
                    if (typeof navigator !== "undefined" && !navigator.onLine) return;
                    setStatus("syncing");
                    try {
                        const json = await saveMonth(url, monthKey, pending);
                        if (JSON.stringify(pendingSave.current) === JSON.stringify(pending)) pendingSave.current = null;
                        clearDraftIfUnchanged(monthKey, pending);
                        setMonths((prev) => (json.months && json.months.length ? json.months : prev));
                        try { localStorage.setItem("ledger-cache-v1-" + monthKey, JSON.stringify({ data: pending, at: Date.now() })); } catch (e) {}
                        setStatus("synced");
                        setUrlError("");
                    } catch (err) {
                        setStatus("error");
                    }
                };
                const onOnline = () => { tryPending(); };
                window.addEventListener("online", onOnline);
                const iv = setInterval(tryPending, 5000);
                return () => {
                    window.removeEventListener("online", onOnline);
                    clearInterval(iv);
                };
            }, [url, monthKey]);

            const connect = async () => {
                const candidate = urlDraft.trim();
                if (!candidate) return;

                setCheckingUrl(true);
                setUrlError("");

                try {
                    await fetchMonth(candidate, currentMonthKey());
                    localStorage.setItem(URL_KEY, candidate);
                    setUrl(candidate);
                    setShowSettings(false);
                    setUrlError("");
                } catch (err) {
                    console.error("Connection error:", err);
                    const cmsg = err && err.message ? String(err.message) : "no response";
                    setUrlError("Couldn't reach that URL (" + cmsg + "). Check it's deployed as 'Anyone' and ends in /exec." + (cmsg.indexOf("404") >= 0 ? " The URL itself looks wrong or the deployment was deleted — copy the current one from Deploy → Manage deployments." : ""));
                } finally {
                    setCheckingUrl(false);
                }
            };

            const disconnect = () => {
                localStorage.removeItem(URL_KEY);
                setUrl(null);
                setData(null);
                setShowSettings(false);
                setUrlError("");
            };

            // ---- PIN screens come first (before even the connect screen) ----
            if (!pin) {
                return (
                    <div style={{ fontFamily: "'Source Serif 4', Georgia, serif", background: PAPER, minHeight: 420, display: "flex", justifyContent: "center", alignItems: "flex-start", padding: "40px 16px" }}>
                        <SetPinScreen error={pinError} onSave={savePin} initialSeconds={lockSeconds} />
                    </div>
                );
            }

            if (isLocked) {
                return (
                    <div style={{ fontFamily: "'Source Serif 4', Georgia, serif", background: PAPER, minHeight: 420, display: "flex", justifyContent: "center", alignItems: "flex-start", padding: "40px 16px" }}>
                        {showForgot ? (
                            <ForgotPinScreen questions={secQuestions} error={pinError} onReset={resetPinWithSecurity} onBack={() => { setShowForgot(false); setPinError(""); }} />
                        ) : (
                            <LockedScreen error={pinError} onUnlock={tryUnlock} onForgot={() => setShowForgot(true)} />
                        )}
                    </div>
                );
            }

            // ---- setup screen ----
            if (!url) {
                return (
                    <div style={{ fontFamily: "'Source Serif 4', Georgia, serif", background: PAPER, border: `1px solid ${RULE}`, borderRadius: 2, padding: 32, color: TEXT, minHeight: 420 }}>
                        <div style={{ fontSize: 11, letterSpacing: 1.5, color: "#6B6555" }}>Rehman &middot; Personal Ledger</div>
                        <div style={{ fontSize: 22, fontWeight: 700, marginTop: 4 }}>Connect to Google Sheets</div>
                        <p style={{ fontSize: 13.5, lineHeight: 1.6, color: "#4A4636", maxWidth: 480, marginTop: 12 }}>
                            Paste the Web App URL from your Apps Script deployment (ends in <code>/exec</code>). Once connected,
                            every change here saves straight to your Google Sheet, and a new month's sheet appears automatically
                            with the opening balance carried over from last month's closing balance.
                        </p>
                        <div className="connect-row" style={{ marginTop: 20, display: "flex", gap: 8, maxWidth: 520 }}>
                            <input
                                type="text"
                                value={urlDraft}
                                onChange={(e) => setUrlDraft(e.target.value)}
                                placeholder="https://script.google.com/macros/s/XXXX/exec"
                                style={{
                                    flex: 1, padding: "10px 12px", fontSize: 13, fontFamily: "'IBM Plex Mono', monospace",
                                    border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff", color: TEXT, outline: "none",
                                }}
                            />
                            <button
                                onClick={connect}
                                disabled={checkingUrl}
                                style={{ padding: "10px 18px", background: INK, color: PAPER, border: "none", borderRadius: 3, fontSize: 13, fontWeight: 600, cursor: "pointer" }}
                            >
                                {checkingUrl ? "Connecting…" : "Connect"}
                            </button>
                        </div>
                        {urlError && <div style={{ marginTop: 10, fontSize: 12.5, color: DEBIT }}>{urlError}</div>}
                        <div style={{ marginTop: 24, fontSize: 12, color: "#8A8470" }}>
                            Don't have the URL yet? Deploy the Code.gs backend first — see the deployment steps in chat.
                        </div>
                    </div>
                );
            }

            if (!data) {
                return (
                    <div style={{ padding: 40, fontFamily: "'Source Serif 4', serif", color: TEXT, background: PAPER, border: `1px solid ${RULE}` }}>
                        {status === "offline" ? (
                            <div>
                                <div style={{ fontSize: 14, fontWeight: 700 }}>Couldn't reach the Sheet</div>
                                <div style={{ fontSize: 12.5, color: DEBIT, marginTop: 6, lineHeight: 1.5 }}>{urlError || "check your connection"}</div>
                                <button
                                    onClick={() => loadMonth(url, monthKey)}
                                    style={{ marginTop: 14, padding: "8px 16px", background: INK, color: PAPER, border: "none", borderRadius: 3, fontSize: 13, fontWeight: 600, cursor: "pointer" }}
                                >
                                    Retry
                                </button>
                            </div>
                        ) : (
                            <div>
                                <div>Opening the ledger…</div>
                                <div style={{ fontSize: 11.5, color: "#8A8470", marginTop: 8 }}>
                                    Fetching data from the Sheet — the first load can take a few seconds.
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            const sum = (arr, key) => arr.reduce((s, r) => s + (Number(r[key]) || 0), 0);
            const amt = (n) => (hideAmounts ? "****" : inr(n));
            const totalFixed = sum(data.fixed, "amount");
            const totalVariable = sum(data.variable, "amount");
            const totalOutgo = totalFixed + totalVariable;
            const surplus = data.salary - totalOutgo;
            const totalAlready = sum(data.alreadyDeducted, "amount");

            // Bank balance is a statement, not a budget forecast: only entries
            // marked Paid reduce it.  Unpaid entries remain in the projection.
            let running = Number(data.openingBalance) || 0;
            let projectedRunning = running;
            // Paid overview items are automatically shown in the statement. They
            // are derived instead of copied, so changing back to Unpaid removes
            // them immediately and cannot create duplicate transactions.
            const overviewPaidEntries = [
                ...(data.fixed || []).map((r) => ({ id: "overview-fixed-" + r.id, sourceList: "fixed", sourceId: r.id, date: "", name: r.name, planned: r.amount, actual: "", paid: r.paid === true })),
                ...(data.variable || []).map((r) => ({ id: "overview-variable-" + r.id, sourceList: "variable", sourceId: r.id, date: "", name: r.name, planned: r.amount, actual: "", paid: r.paid === true })),
            ].filter((r) => r.paid);
            const balanceEntries = [...overviewPaidEntries, ...(data.expenses || [])];
            const expenseRows = balanceEntries.map((e) => {
                // Old saved months did not have `paid`; an entered actual amount
                // is treated as paid so their historical balance stays correct.
                const paid = e.paid === true || (e.paid === undefined && e.actual !== "" && e.actual !== undefined && e.actual !== null);
                const amount = e.actual === "" || e.actual === undefined || e.actual === null ? Number(e.planned) || 0 : Number(e.actual) || 0;
                if (paid) running -= amount;
                projectedRunning -= amount;
                return { ...e, paid, amount, balanceAfter: running, projectedBalanceAfter: projectedRunning };
            });
            const currentBalanceBeforeMisc = running;
            const projectedBalance = projectedRunning;
            const totalMisc = sum(data.misc || [], "amount");
            let miscRunning = currentBalanceBeforeMisc;
            const miscRows = (data.misc || []).map((m) => {
                const amt = Number(m.amount) || 0;
                miscRunning -= amt;
                return { ...m, balanceAfter: miscRunning };
            });
            const actualBalance = miscRunning;
            const actualBuffer = actualBalance - (Number(data.minBalance) || 0);
            const notes = data.notes || [];

            const wishlistTotalNeeded = data.wishlist.reduce((s, w) => {
                const cost = Number(w.cost) || 0;
                const saved = Number(w.saved) || 0;
                return s + Math.max(cost - saved, 0);
            }, 0);

            const update = (patch) => setData((d) => ({ ...d, ...patch }));
            const updateRow = (listKey, id, patch) =>
                update({ [listKey]: data[listKey].map((r) => (r.id === id ? { ...r, ...patch } : r)) });
            const removeRow = (listKey, id) => update({ [listKey]: data[listKey].filter((r) => r.id !== id) });
            const addRow = (listKey, row) => update({ [listKey]: [...(data[listKey] || []), { id: uid(), ...row }] });
            const updateBalanceRow = (entry, patch) => {
                if (entry.sourceList) {
                    // Overview-generated rows only need their Paid state changed;
                    // name and amount are edited in Overview itself.
                    if (Object.prototype.hasOwnProperty.call(patch, "paid")) updateRow(entry.sourceList, entry.sourceId, { paid: patch.paid });
                    return;
                }
                updateRow("expenses", entry.id, patch);
            };
            const removeBalanceRow = (entry) => {
                if (entry.sourceList) updateRow(entry.sourceList, entry.sourceId, { paid: false });
                else removeRow("expenses", entry.id);
            };
            const moveRow = (listKey, fromId, toId) => {
                if (fromId === toId) return;
                const rows = [...(data[listKey] || [])];
                const from = rows.findIndex((r) => r.id === fromId);
                const to = rows.findIndex((r) => r.id === toId);
                if (from < 0 || to < 0) return;
                const [row] = rows.splice(from, 1);
                rows.splice(to, 0, row);
                update({ [listKey]: rows });
            };
            const dragProps = (listKey, id) => ({
                draggable: true,
                onDragStart: (e) => {
                    draggedRow.current = { listKey, id };
                    setDragging(id);
                    if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
                },
                onDragOver: (e) => {
                    if (draggedRow.current && draggedRow.current.listKey === listKey) e.preventDefault();
                },
                onDrop: (e) => {
                    e.preventDefault();
                    const source = draggedRow.current;
                    if (source && source.listKey === listKey) moveRow(listKey, source.id, id);
                    draggedRow.current = null;
                    setDragging(null);
                },
                onDragEnd: () => { draggedRow.current = null; setDragging(null); },
                style: dragging === id ? { opacity: 0.45 } : undefined,
            });

            const monthOptions = Array.from(new Set([...(months || []), currentMonthKey()])).sort((a, b) => {
                const [ma, ya] = a.split("-");
                const [mb, yb] = b.split("-");
                return new Date(+ya, MONTHS.indexOf(ma), 1) - new Date(+yb, MONTHS.indexOf(mb), 1);
            });

            const statusLabel = {
                loading: "loading…",
                syncing: "saving…",
                synced: "synced to Sheet",
                offline: "offline — retry",
                error: "offline — will auto-sync",
                idle: "",
            }[status];

            return (
                <div className="ledger" style={{ fontFamily: "'Source Serif 4', Georgia, serif", color: TEXT, background: PAPER, minHeight: 560, borderRadius: 2, overflow: "hidden", border: `1px solid ${RULE}` }}>
                    {/* Cover band */}
                    <div className="cover" style={{ background: INK, color: PAPER, padding: "18px 22px", display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
                        <div>
                            <div style={{ fontSize: 11, letterSpacing: 1.5, opacity: 0.65 }}>Rehman &middot; Personal Ledger</div>
                            <div style={{ fontSize: 22, fontWeight: 700, marginTop: 2 }}>Monthly Budget</div>
                        </div>
                        <div className="cover-controls" style={{ display: "flex", alignItems: "center", gap: 14 }}>
                            {/* month picker */}
                            <div style={{ position: "relative" }}>
                                <button
                                    onClick={() => setShowMonthPicker((s) => !s)}
                                    style={{ display: "flex", alignItems: "center", gap: 5, background: "rgba(241,237,225,0.1)", border: `1px solid rgba(241,237,225,0.3)`, borderRadius: 3, color: PAPER, fontSize: 12.5, padding: "6px 10px", cursor: "pointer" }}
                                >
                                    {monthKey} <IconComponent name="ChevronDown" size={12} />
                                </button>
                                {showMonthPicker && (
                                    <div style={{ position: "absolute", right: 0, top: "110%", background: PAPER, border: `1px solid ${RULE}`, borderRadius: 3, minWidth: 120, zIndex: 10, boxShadow: "0 4px 12px rgba(0,0,0,0.15)" }}>
                                        {monthOptions.map((mk) => (
                                            <button
                                                key={mk}
                                                onClick={() => { setMonthKey(mk);
                                                    setShowMonthPicker(false); }}
                                                style={{
                                                    display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%",
                                                    textAlign: "left", padding: "7px 12px", fontSize: 12.5, border: "none",
                                                    background: mk === monthKey ? PAPER_DARK : "transparent", color: TEXT, cursor: "pointer",
                                                }}
                                            >
                                                {mk} {mk === currentMonthKey() && <span style={{ fontSize: 10, color: "#8A8470" }}>current</span>}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div style={{ fontSize: 11, opacity: 0.75, fontFamily: "'IBM Plex Mono', monospace", display: "flex", alignItems: "center", gap: 4 }}>
                                {status === "syncing" && <span className="spin"><IconComponent name="RefreshCw" size={11} /></span>}
                                {status === "synced" && <IconComponent name="Check" size={11} />}
                                {(status === "offline" || status === "error") && <IconComponent name="CloudOff" size={11} />}
                                {statusLabel}
                            </div>
                            <button onClick={() => setHideAmounts((h) => !h)} style={{ background: "none", border: "none", color: PAPER, opacity: 0.7, cursor: "pointer", padding: 4 }} aria-label={hideAmounts ? "Show amounts" : "Hide amounts"} title={hideAmounts ? "Show amounts" : "Hide amounts"}>
                                <IconComponent name={hideAmounts ? "EyeOff" : "Eye"} size={15} />
                            </button>
                            <button onClick={() => { setUrlDraft(url);
                                setShowSettings(true); }} style={{ background: "none", border: "none", color: PAPER, opacity: 0.7, cursor: "pointer", padding: 4 }} aria-label="Settings">
                                <IconComponent name="Settings" size={15} />
                            </button>
                            <button onClick={() => loadMonth(url, monthKey)} style={{ background: "none", border: "none", color: PAPER, opacity: 0.7, cursor: "pointer", padding: 4 }} aria-label="Refresh from Sheet">
                                <IconComponent name="RefreshCw" size={15} />
                            </button>
                        </div>
                    </div>

                    {showSettings && (
                        <div style={{ padding: "14px 22px", background: PAPER_DARK, borderBottom: `1px solid ${RULE}`, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                            <input
                                type="text"
                                value={urlDraft}
                                onChange={(e) => setUrlDraft(e.target.value)}
                                style={{ flex: 1, minWidth: 220, padding: "7px 10px", fontSize: 12.5, fontFamily: "'IBM Plex Mono', monospace", border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff" }}
                            />
                            <button onClick={connect} style={{ padding: "7px 14px", background: INK, color: PAPER, border: "none", borderRadius: 3, fontSize: 12.5, cursor: "pointer" }}>Save URL</button>
                            <button onClick={disconnect} style={{ padding: "7px 14px", background: "none", color: DEBIT, border: `1px solid ${DEBIT}`, borderRadius: 3, fontSize: 12.5, cursor: "pointer" }}>Disconnect</button>
                            <button onClick={() => setShowSettings(false)} style={{ padding: "7px 14px", background: "none", color: TEXT, border: `1px solid ${RULE}`, borderRadius: 3, fontSize: 12.5, cursor: "pointer" }}>Close</button>
                            <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${RULE}`, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", width: "100%" }}>
                                <label style={{ fontSize: 12, color: "#6B6555", display: "flex", alignItems: "center", gap: 6 }}>
                                    Auto-lock:
                                    <select
                                        value={lockSeconds}
                                        onChange={(e) => {
                                            const v = Number(e.target.value);
                                            setLockSeconds(v);
                                            localStorage.setItem("ledger-lock-seconds-v1", String(v));
                                            lastActivity.current = Date.now();
                                        }}
                                        style={{ padding: "6px 8px", border: `1px solid ${RULE}`, borderRadius: 3, background: "#fff", fontSize: 12 }}
                                    >
                                        <option value={30}>30 sec</option>
                                        <option value={60}>1 min</option>
                                        <option value={120}>2 min</option>
                                        <option value={180}>3 min</option>
                                        <option value={300}>5 min</option>
                                    </select>
                                </label>
                                <button onClick={() => setIsLocked(true)} style={{ padding: "7px 14px", background: "none", color: INK, border: `1px solid ${RULE}`, borderRadius: 3, fontSize: 12.5, cursor: "pointer" }}>Lock now</button>
                                <button onClick={() => {
                                    const np = window.prompt("New PIN (4+ digits, numbers only):");
                                    if (np === null) return;
                                    const clean = np.trim();
                                    if (/^\d{4,}$/.test(clean)) {
                                        localStorage.setItem("ledger-pin-v1", clean);
                                        setPin(clean);
                                        setPinError("");
                                        lastActivity.current = Date.now();
                                    } else {
                                        window.alert("PIN must be at least 4 digits — numbers only.");
                                    }
                                }} style={{ padding: "7px 14px", background: "none", color: INK, border: `1px solid ${RULE}`, borderRadius: 3, fontSize: 12.5, cursor: "pointer" }}>Change PIN</button>
                                <button onClick={() => {
                                    if (window.confirm("Remove PIN? Anyone will then be able to open without a PIN.")) {
                                        resetPin();
                                    }
                                }} style={{ padding: "7px 14px", background: "none", color: DEBIT, border: `1px solid ${DEBIT}`, borderRadius: 3, fontSize: 12.5, cursor: "pointer" }}>Remove PIN</button>
                            </div>
                        </div>
                    )}

                    {/* Tabs */}
                    <div className="tabbar" style={{ display: "flex", background: PAPER_DARK, borderBottom: `2px solid ${INK}` }}>
                        {TABS.map((t) => {
                            const active = tab === t.id;
                            return (
                                <button
                                    key={t.id}
                                    onClick={() => setTab(t.id)}
                                    style={{
                                        display: "flex", alignItems: "center", gap: 6, flex: 1, justifyContent: "center",
                                        padding: "10px 6px", cursor: "pointer", border: "none", borderRight: `1px solid ${RULE}`,
                                        background: active ? PAPER : "transparent", color: active ? INK : "#7A7460",
                                        fontWeight: active ? 700 : 400, fontSize: 13,
                                        borderBottom: active ? `2px solid ${DEBIT}` : "2px solid transparent", marginBottom: -2,
                                    }}
                                >
                                    <IconComponent name={t.icon} size={14} /> {t.label}
                                </button>
                            );
                        })}
                    </div>

                    {urlError && (
                        <div style={{ padding: "10px 24px", background: "#F3DAD5", color: DEBIT, fontSize: 12.5, borderBottom: `1px solid ${RULE}` }}>
                            ⚠ {urlError}
                        </div>
                    )}

                    <div className="content" style={{ padding: "20px 24px 28px" }}>
                        {tab === "overview" && (
                            <div>
                                <Field label="MONTHLY SALARY (IN-HAND)">
                                    <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginTop: 4 }}>
                                        <IconComponent name="IndianRupee" size={18} />
                                        {hideAmounts ? (
                                            <span style={{ fontSize: 26, fontWeight: 700, fontFamily: "'IBM Plex Mono', monospace", color: INK }}>****</span>
                                        ) : (
                                            <input
                                                type="number"
                                                value={data.salary}
                                                onChange={(e) => update({ salary: Number(e.target.value) || 0 })}
                                                style={{ fontSize: 26, fontWeight: 700, border: "none", background: "transparent", fontFamily: "'IBM Plex Mono', monospace", color: INK, outline: "none", width: 200 }}
                                            />
                                        )}
                                    </div>
                                </Field>

                                <div className="two-col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 28, marginTop: 24 }}>
                                    <div>
                                        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 6 }}>Fixed commitments</div>
                                        {data.fixed.map((r) => (
                                            <RowShell key={r.id} onRemove={() => removeRow("fixed", r.id)} dragProps={dragProps("fixed", r.id)}>
                                                <TextCell value={r.name} onChange={(v) => updateRow("fixed", r.id, { name: v })} />
                                                <NumberCell value={r.amount} onChange={(v) => updateRow("fixed", r.id, { amount: v })} tone={DEBIT} />
                                                <select value={r.paid ? "paid" : "unpaid"} onChange={(e) => updateRow("fixed", r.id, { paid: e.target.value === "paid" })} style={{ padding: "5px 2px", border: `1px solid ${r.paid ? CREDIT : RULE}`, borderRadius: 3, background: r.paid ? "#E1EEE7" : "#fff", color: r.paid ? CREDIT : TEXT, fontSize: 11 }}><option value="unpaid">Unpaid</option><option value="paid">Paid</option></select>
                                            </RowShell>
                                        ))}
                                        <AddButton onClick={() => addRow("fixed", { name: "New item", amount: 0, paid: false })}>Add fixed item</AddButton>
